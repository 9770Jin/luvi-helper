name: Deploy Discord Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18' 

      # 3. Install dependencies 
      - name: Install dependencies locally
        run: npm install

      # 4. Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Navigate to your bot directory
            cd /var/www/c1bc1324-2fb9-4488-9953-ff8ada851782/discord_bots/luvi-helper
            
            # Pull latest changes from Git
            git pull
            
            # Install any new dependencies
            npm install
            
            # Restart bot with PM2, or start if not running
            pm2 restart luvi-helper || pm2 start index.js --name luvi-helper
            
            # Save PM2 process list for auto-start on server reboot
            pm2 save
